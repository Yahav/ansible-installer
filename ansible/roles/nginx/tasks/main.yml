---
- name: Uninstall web server packages that may conflict with nginx
  dnf:
    name:
      - httpd
      - lighttpd
    state: absent


- name: Remove any older nginx
  dnf:
    name:
      - nginx
      - nginx-*
    state: absent

# AzuraCast 0.24+ needs nginx mainline ("http2 on;", $is_request_port / $request_port),
# which the distribution packages are too old for.
- name: Import the nginx.org signing key
  rpm_key:
    key: https://nginx.org/keys/nginx_signing.key
    state: present

- name: Add the nginx.org mainline repository
  ansible.builtin.yum_repository:
    name: nginx-mainline
    description: nginx mainline repo
    baseurl: "https://nginx.org/packages/mainline/centos/{{ ansible_distribution_major_version }}/$basearch/"
    gpgcheck: true
    gpgkey: https://nginx.org/keys/nginx_signing.key
    enabled: true
    module_hotfixes: true

- name: Install nginx
  dnf:
    name:
      - nginx
    state: latest
    update_cache: true

- name: Remove the default site shipped by the nginx.org package
  file:
    path: /etc/nginx/conf.d/default.conf
    state: absent

- name: Add nginx global config
  template:
    src: "{{ playbook_dir }}/roles/nginx/templates/nginx.conf.j2"
    dest: /etc/nginx/nginx.conf
    force: true
    backup: true
    mode: 0644

- name: Add app-specific nginx site
  template:
    src: "{{ playbook_dir }}/roles/nginx/templates/default.j2"
    dest: /etc/nginx/conf.d/00-azuracast.conf
    force: true
    mode: 0644

- name: Copy proxy_params.conf
  template:
    src: "{{ playbook_dir }}/roles/nginx/templates/proxy_params.conf.j2"
    dest: /etc/nginx/proxy_params
    force: true
    mode: 0644


- name: Turn sendfile off on nginx for local development
  replace:
    dest: /etc/nginx/nginx.conf
    regexp: 'sendfile on;'
    replace: 'sendfile off;'
  when: app_env == "development"


- name: Create Temp Folders
  file:
    path: "{{ nginx_tmp_dirs }}"
    state: directory
  loop:
    - "/tmp/nginx_client"
    - "/tmp/nginx_fastcgi"
    - "/tmp/nginx_cache"
  loop_control:
    loop_var: nginx_tmp_dirs

- name: Create azuracast.conf.d Folders
  file:
    path: /etc/nginx/azuracast.conf.d/
    state: directory

- name: Change M3U8 MIME type to "application/x-mpegurl" for broader compatibility.
  shell: "sed -i 's#application/vnd.apple.mpegurl#application/x-mpegurl#' /etc/nginx/mime.types"
  
- name: Create self-signed SSL cert
  command: >-
    openssl req -new -nodes -x509 -subj "/C=US/ST=Texas/L=Austin/O=IT/CN=${ansible_fqdn}" -days 3650
    -keyout {{ app_base }}/storage/acme/default.key -out {{ app_base }}/storage/acme/default.crt -extensions v3_ca
  args:
    creates: "{{ app_base }}/storage/acme/default.crt"

- name: Change key file ownership
  ansible.builtin.file:
    path: "{{ app_base }}/storage/acme/default.key"
    owner: azuracast
    group: azuracast

- name: Change crt file ownership
  ansible.builtin.file:
    path: "{{ app_base }}/storage/acme/default.crt"
    owner: azuracast
    group: azuracast
    
# Only when no certificate is linked yet: on an existing server ssl.key / ssl.crt point at the
# real (ACME or custom) certificate, and relinking would swap it for the self-signed one.
- name: Check for an existing SSL key link
  stat:
    path: "{{ app_base }}/storage/acme/ssl.key"
  register: nginx_ssl_key_link

- name: Check for an existing SSL cert link
  stat:
    path: "{{ app_base }}/storage/acme/ssl.crt"
  register: nginx_ssl_crt_link

- name: Link self-signed SSL key if applicable.
  file:
    path: "{{ app_base }}/storage/acme/ssl.key"
    state: link
    src: "{{ app_base }}/storage/acme/default.key"
  when: not nginx_ssl_key_link.stat.exists

- name: Link self-signed SSL cert if applicable.
  file:
    path: "{{ app_base }}/storage/acme/ssl.crt"
    state: link
    src: "{{ app_base }}/storage/acme/default.crt"
  when: not nginx_ssl_crt_link.stat.exists

- name: Ensure nginx tmp directories exist at boot
  copy:
    dest: /etc/tmpfiles.d/nginx-azuracast.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      d /tmp/nginx_client 0755 azuracast nginx - -
      d /tmp/nginx_fastcgi 0755 azuracast nginx - -
      d /tmp/nginx_cache 0755 azuracast nginx - -

- name: Apply tmpfiles
  command: systemd-tmpfiles --create

- name: Validate the nginx configuration
  command: nginx -t
  changed_when: false
  # Station nginx.conf includes may not exist yet on a fresh install.
  when: update_mode | default(false) | bool

- name: Install Nginx Supervisord conf
  template:
    src: "{{ playbook_dir }}/roles/nginx/templates/supervisor.conf.j2"
    dest: /etc/supervisord.d/nginx.conf
    force: true
    mode: 0644

- name: Disable Nginx service
  systemd_service:
    name: "nginx"
    enabled: false
    state: stopped
  ignore_errors: true
  when: is_systemd == True
